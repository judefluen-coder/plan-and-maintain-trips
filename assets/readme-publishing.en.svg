<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="980" viewBox="0 0 1800 735" role="img" aria-labelledby="title desc">
  <title id="title">Travel guide multi-document publishing adapters</title>
  <desc id="desc">A diagram showing one canonical trip project publishing to Feishu Lark, Markdown, Notion, Google Docs, DOCX, and PDF with local-first and read-back verification safeguards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F7F1"/>
      <stop offset="1" stop-color="#EEF2EF"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173A60"/>
      <stop offset="1" stop-color="#0E6970"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#173654" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8DA1B3"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .navy { fill: #173A60; }
      .muted { fill: #647789; }
      .label { font-size: 13px; font-weight: 720; letter-spacing: 1.5px; }
      .title { font-size: 22px; font-weight: 760; fill: #173A60; }
      .copy { font-size: 14px; font-weight: 540; fill: #607487; }
    </style>
  </defs>

  <rect width="1800" height="735" fill="url(#bg)"/>
  <g class="sans">
    <text x="62" y="66" class="label" fill="#168270">MULTI-DOCUMENT OUTPUT · OPTIONAL ADAPTERS</text>
    <text x="62" y="116" font-size="40" font-weight="780" class="navy">Plan once. Publish wherever the traveler works.</text>
    <text x="62" y="150" font-size="17" font-weight="520" class="muted">The local package is always completed first; connected publishers are delivery channels, never a dependency.</text>

    <!-- Canonical source -->
    <g transform="translate(62 204)" filter="url(#shadow)">
      <rect width="492" height="356" rx="28" fill="url(#source)"/>
      <rect x="26" y="25" width="184" height="35" rx="17" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="118" y="48" text-anchor="middle" class="label" fill="#C9DCE9">ONE SOURCE OF TRUTH</text>
      <text x="28" y="106" font-size="28" font-weight="760" fill="#FFFFFF">Canonical trip project</text>
      <text x="28" y="137" font-size="15" font-weight="520" fill="#C8D9E6">Every output is generated from the same version.</text>

      <g transform="translate(28 174)">
        <rect width="206" height="60" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2"/>
        <circle cx="28" cy="30" r="11" fill="#D38600"/>
        <text x="50" y="26" font-size="14" font-weight="700" fill="#FFFFFF">trip.json</text>
        <text x="50" y="44" font-size="12" fill="#C8D9E6">dates · anchors · status</text>
        <rect x="224" width="206" height="60" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2"/>
        <circle cx="252" cy="30" r="11" fill="#168270"/>
        <text x="274" y="26" font-size="14" font-weight="700" fill="#FFFFFF">guide.md</text>
        <text x="274" y="44" font-size="12" fill="#C8D9E6">itinerary · food · notes</text>
        <rect y="76" width="206" height="60" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2"/>
        <circle cx="28" cy="106" r="11" fill="#7354A5"/>
        <text x="50" y="102" font-size="14" font-weight="700" fill="#FFFFFF">route maps</text>
        <text x="50" y="120" font-size="12" fill="#C8D9E6">SVG · high-res PNG</text>
        <rect x="224" y="76" width="206" height="60" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2"/>
        <circle cx="252" cy="106" r="11" fill="#008F8F"/>
        <text x="274" y="102" font-size="14" font-weight="700" fill="#FFFFFF">field cards</text>
        <text x="274" y="120" font-size="12" fill="#C8D9E6">one image per day</text>
      </g>
    </g>

    <!-- Connector -->
    <path d="M578 382 C650 382 664 382 720 382" fill="none" stroke="#8DA1B3" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="594" y="338" width="112" height="34" rx="17" fill="#E4ECEF"/>
    <text x="650" y="360" text-anchor="middle" font-size="12" font-weight="720" fill="#49657E">PUBLISH</text>

    <!-- Adapter grid -->
    <g transform="translate(744 204)">
      <g filter="url(#shadow)">
        <rect width="310" height="162" rx="24" fill="#FFFFFF"/>
        <rect width="10" height="162" rx="5" fill="#3370FF"/>
        <circle cx="50" cy="48" r="25" fill="#E7EEFF"/>
        <text x="50" y="55" text-anchor="middle" font-size="20" font-weight="800" fill="#3370FF">F</text>
        <text x="88" y="45" class="title">Feishu / Lark</text>
        <text x="88" y="70" class="copy">Docx or Wiki document</text>
        <rect x="24" y="104" width="126" height="32" rx="16" fill="#E7EEFF"/>
        <text x="87" y="125" text-anchor="middle" font-size="12" font-weight="720" fill="#315FD0">WHEN CONNECTED</text>
        <text x="170" y="125" font-size="12" font-weight="620" fill="#6A7D8E">write + read back</text>
      </g>
      <g transform="translate(330 0)" filter="url(#shadow)">
        <rect width="310" height="162" rx="24" fill="#FFFFFF"/>
        <rect width="10" height="162" rx="5" fill="#173A60"/>
        <circle cx="50" cy="48" r="25" fill="#E8EDF2"/>
        <text x="50" y="55" text-anchor="middle" font-size="18" font-weight="800" fill="#173A60">M↓</text>
        <text x="88" y="45" class="title">Markdown</text>
        <text x="88" y="70" class="copy">Portable source package</text>
        <rect x="24" y="104" width="112" height="32" rx="16" fill="#E8EDF2"/>
        <text x="80" y="125" text-anchor="middle" font-size="12" font-weight="720" fill="#315579">ALWAYS READY</text>
        <text x="155" y="125" font-size="12" font-weight="620" fill="#6A7D8E">no account needed</text>
      </g>
      <g transform="translate(660 0)" filter="url(#shadow)">
        <rect width="310" height="162" rx="24" fill="#FFFFFF"/>
        <rect width="10" height="162" rx="5" fill="#333333"/>
        <circle cx="50" cy="48" r="25" fill="#EEEEEE"/>
        <text x="50" y="55" text-anchor="middle" font-size="20" font-weight="800" fill="#333333">N</text>
        <text x="88" y="45" class="title">Notion</text>
        <text x="88" y="70" class="copy">Page or knowledge base</text>
        <rect x="24" y="104" width="126" height="32" rx="16" fill="#EEEEEE"/>
        <text x="87" y="125" text-anchor="middle" font-size="12" font-weight="720" fill="#444444">WHEN CONNECTED</text>
        <text x="170" y="125" font-size="12" font-weight="620" fill="#6A7D8E">adapter based</text>
      </g>
      <g transform="translate(0 184)" filter="url(#shadow)">
        <rect width="310" height="162" rx="24" fill="#FFFFFF"/>
        <rect width="10" height="162" rx="5" fill="#4285F4"/>
        <circle cx="50" cy="48" r="25" fill="#E8F0FE"/>
        <text x="50" y="55" text-anchor="middle" font-size="20" font-weight="800" fill="#4285F4">G</text>
        <text x="88" y="45" class="title">Google Docs</text>
        <text x="88" y="70" class="copy">Connected document</text>
        <rect x="24" y="104" width="126" height="32" rx="16" fill="#E8F0FE"/>
        <text x="87" y="125" text-anchor="middle" font-size="12" font-weight="720" fill="#3169BC">WHEN CONNECTED</text>
        <text x="170" y="125" font-size="12" font-weight="620" fill="#6A7D8E">permission aware</text>
      </g>
      <g transform="translate(330 184)" filter="url(#shadow)">
        <rect width="310" height="162" rx="24" fill="#FFFFFF"/>
        <rect width="10" height="162" rx="5" fill="#2B579A"/>
        <circle cx="50" cy="48" r="25" fill="#E7EDF6"/>
        <text x="50" y="55" text-anchor="middle" font-size="19" font-weight="800" fill="#2B579A">W</text>
        <text x="88" y="45" class="title">DOCX</text>
        <text x="88" y="70" class="copy">Editable offline handoff</text>
        <rect x="24" y="104" width="116" height="32" rx="16" fill="#E7EDF6"/>
        <text x="82" y="125" text-anchor="middle" font-size="12" font-weight="720" fill="#315783">WHEN AVAILABLE</text>
        <text x="158" y="125" font-size="12" font-weight="620" fill="#6A7D8E">document tools</text>
      </g>
      <g transform="translate(660 184)" filter="url(#shadow)">
        <rect width="310" height="162" rx="24" fill="#FFFFFF"/>
        <rect width="10" height="162" rx="5" fill="#C53D49"/>
        <circle cx="50" cy="48" r="25" fill="#F7E7E8"/>
        <text x="50" y="55" text-anchor="middle" font-size="17" font-weight="800" fill="#B83642">PDF</text>
        <text x="88" y="45" class="title">PDF</text>
        <text x="88" y="70" class="copy">Print and offline archive</text>
        <rect x="24" y="104" width="116" height="32" rx="16" fill="#F7E7E8"/>
        <text x="82" y="125" text-anchor="middle" font-size="12" font-weight="720" fill="#A83340">WHEN AVAILABLE</text>
        <text x="158" y="125" font-size="12" font-weight="620" fill="#6A7D8E">render + inspect</text>
      </g>
    </g>

    <!-- Safety rail -->
    <g transform="translate(62 596)">
      <rect width="1680" height="86" rx="22" fill="#FFFFFF" stroke="#C8D4DC" stroke-width="2"/>
      <circle cx="39" cy="43" r="15" fill="#168270"/><text x="39" y="48" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">1</text>
      <text x="66" y="40" font-size="15" font-weight="720" class="navy">LOCAL FIRST</text>
      <text x="66" y="61" font-size="13" font-weight="540" class="muted">complete the package</text>
      <path d="M260 43 H348" stroke="#9AAAB8" stroke-width="4" marker-end="url(#arrow)"/>
      <circle cx="394" cy="43" r="15" fill="#D38600"/><text x="394" y="48" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">2</text>
      <text x="421" y="40" font-size="15" font-weight="720" class="navy">AUTHORIZE</text>
      <text x="421" y="61" font-size="13" font-weight="540" class="muted">publish only with permission</text>
      <path d="M674 43 H762" stroke="#9AAAB8" stroke-width="4" marker-end="url(#arrow)"/>
      <circle cx="808" cy="43" r="15" fill="#226DA8"/><text x="808" y="48" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">3</text>
      <text x="835" y="40" font-size="15" font-weight="720" class="navy">READ BACK</text>
      <text x="835" y="61" font-size="13" font-weight="540" class="muted">verify dates, anchors and images</text>
      <rect x="1194" y="20" width="458" height="48" rx="24" fill="#E7F2EE"/>
      <text x="1423" y="50" text-anchor="middle" font-size="14" font-weight="720" fill="#14705E">NO FEISHU CLI? THE LOCAL PACKAGE STILL SHIPS.</text>
    </g>
  </g>
</svg>
