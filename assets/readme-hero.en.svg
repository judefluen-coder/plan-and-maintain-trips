<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">Plan and Maintain Trips</title>
  <desc id="description">A dark blue travel planning banner with a colorful route and a day-of itinerary card.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102C50"/>
      <stop offset="0.58" stop-color="#173D68"/>
      <stop offset="1" stop-color="#0D6C6C"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83D6C4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#F5C45E" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#071B2D" flood-opacity="0.35"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="520" rx="34" fill="url(#background)"/>
  <circle cx="1410" cy="45" r="360" fill="url(#glow)"/>
  <circle cx="114" cy="520" r="260" fill="#9BC6FF" opacity="0.06"/>

  <g opacity="0.12" stroke="#D8E8F8" fill="none">
    <path d="M40 102 C270 50 430 170 672 104 S1048 70 1240 152 S1458 252 1580 180"/>
    <path d="M20 358 C280 286 460 402 704 338 S1064 270 1270 356 S1482 442 1600 396"/>
    <path d="M310 0 C282 142 338 268 292 520"/>
    <path d="M904 0 C850 156 920 336 872 520"/>
  </g>

  <g class="sans">
    <rect x="86" y="74" width="330" height="42" rx="21" fill="#E8F4F1" opacity="0.96"/>
    <text x="251" y="102" text-anchor="middle" font-size="18" font-weight="750" letter-spacing="2.4" fill="#136B60">PLAN · VERIFY · BOOK · GO</text>

    <text x="86" y="202" font-size="66" font-weight="780" fill="#FFFFFF">Plan &amp; Maintain Trips</text>
    <text x="86" y="250" font-size="27" font-weight="520" fill="#CFE0EF">From scattered ideas to one executable, auditable journey.</text>
    <text x="86" y="302" font-size="25" font-weight="520" fill="#F5E9CF">Routes, bookings, dining, and field cards — maintained together, always in sync.</text>

    <g transform="translate(88 378)">
      <path d="M0 18 C90 -38 142 68 236 14 S385 52 476 2 S610 20 690 -22" fill="none" stroke="#FFFFFF" stroke-opacity="0.48" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 13"/>
      <g>
        <circle cx="0" cy="18" r="17" fill="#B83B45" stroke="#FFFFFF" stroke-width="5"/>
        <circle cx="144" cy="35" r="17" fill="#16866B" stroke="#FFFFFF" stroke-width="5"/>
        <circle cx="286" cy="-2" r="17" fill="#D98B00" stroke="#FFFFFF" stroke-width="5"/>
        <circle cx="430" cy="22" r="17" fill="#1D6CAA" stroke="#FFFFFF" stroke-width="5"/>
        <circle cx="566" cy="-4" r="17" fill="#7653A9" stroke="#FFFFFF" stroke-width="5"/>
        <circle cx="690" cy="-22" r="17" fill="#009090" stroke="#FFFFFF" stroke-width="5"/>
      </g>
      <text x="0" y="72" font-size="18" fill="#BAD0E2">one source of truth</text>
      <text x="256" y="72" font-size="18" fill="#BAD0E2">controlled changes</text>
      <text x="536" y="72" font-size="18" fill="#BAD0E2">calm execution</text>
    </g>
  </g>

  <g transform="translate(1128 72)" filter="url(#shadow)" class="sans">
    <rect width="386" height="376" rx="28" fill="#FAF8F1"/>
    <rect width="386" height="82" rx="28" fill="#D88700"/>
    <path d="M0 54 H386 V82 H0 Z" fill="#D88700"/>
    <text x="28" y="34" font-size="16" font-weight="750" letter-spacing="2" fill="#FFF5DD">DAY 03 · FIELD CARD</text>
    <text x="28" y="64" font-size="22" font-weight="760" fill="#FFFFFF">Protect the 09:30 entry</text>

    <line x1="50" y1="119" x2="50" y2="286" stroke="#D9D9D2" stroke-width="4"/>
    <circle cx="50" cy="126" r="15" fill="#B83B45"/>
    <circle cx="50" cy="194" r="15" fill="#16866B"/>
    <circle cx="50" cy="262" r="15" fill="#1D6CAA"/>
    <text x="84" y="122" font-size="16" font-weight="720" fill="#173A62">09:05 · arrive for security</text>
    <text x="84" y="146" font-size="14" fill="#68798A">ticket saved offline</text>
    <text x="84" y="190" font-size="16" font-weight="720" fill="#173A62">09:30 · timed entry</text>
    <text x="84" y="214" font-size="14" fill="#68798A">hard anchor · 2 hr</text>
    <text x="84" y="258" font-size="16" font-weight="720" fill="#173A62">12:15 · route-linked lunch</text>
    <text x="84" y="282" font-size="14" fill="#68798A">backup is 4 min away</text>

    <rect x="26" y="316" width="334" height="38" rx="19" fill="#E8F3EF"/>
    <text x="193" y="341" text-anchor="middle" font-size="15" font-weight="700" fill="#146D5D">RAIN PLAN READY · LINKS CHECKED</text>
  </g>
</svg>
