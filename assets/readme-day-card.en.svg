<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 1800 1125" role="img" aria-labelledby="title desc">
  <title id="title">Mobile-first day-of travel execution card</title>
  <desc id="desc">A detailed daily travel card showing a protected booking, timeline, movement, tickets, route, pace, late rule, rain fallback, and one-tap links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9F3"/>
      <stop offset="1" stop-color="#EFE9DD"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173A60"/>
      <stop offset="1" stop-color="#135E6D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#173654" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="60" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <path d="M0 12 H60 M0 36 H60 M18 0 V48 M46 0 V48" fill="none" stroke="#D8D9D4" stroke-width="1.2"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .navy { fill: #173A60; }
      .muted { fill: #647789; }
      .label { font-size: 14px; font-weight: 720; letter-spacing: 1.4px; }
      .time { font-size: 20px; font-weight: 780; fill: #173A60; }
      .item { font-size: 20px; font-weight: 720; fill: #173A60; }
      .meta { font-size: 14px; font-weight: 520; fill: #65798B; }
    </style>
  </defs>

  <rect width="1800" height="1125" fill="url(#bg)"/>

  <g class="sans">
    <text x="62" y="68" class="label" fill="#168270">DAY-OF FIELD CARD · EXAMPLE OUTPUT</text>
    <text x="62" y="124" font-size="43" font-weight="780" class="navy">Day 02 · Art, architecture &amp; a protected entry</text>
    <text x="62" y="159" font-size="17" font-weight="520" class="muted">Lisbon · Friday, 2 May · designed to save before leaving the hotel</text>

    <g transform="translate(1270 70)">
      <rect width="132" height="40" rx="20" fill="#E6F1ED"/>
      <text x="66" y="26" text-anchor="middle" font-size="14" font-weight="720" fill="#13705E">MEDIUM</text>
      <rect x="144" width="116" height="40" rx="20" fill="#E7EEF5"/>
      <text x="202" y="26" text-anchor="middle" font-size="14" font-weight="720" fill="#31587C">5.2 KM</text>
      <rect x="272" width="198" height="40" rx="20" fill="#F7EED8"/>
      <text x="371" y="26" text-anchor="middle" font-size="14" font-weight="720" fill="#986100">1 HARD ANCHOR</text>
    </g>

    <!-- Main timeline -->
    <rect x="58" y="194" width="1110" height="855" rx="28" fill="#FFFFFF" stroke="#C3CFD8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="58" y="194" width="1110" height="112" rx="28" fill="url(#header)"/>
    <path d="M58 278 H1168 V306 H58 Z" fill="url(#header)"/>
    <text x="92" y="238" font-size="14" font-weight="720" letter-spacing="1.6" fill="#BFD5E6">TODAY'S NON-NEGOTIABLE</text>
    <text x="92" y="277" font-size="26" font-weight="760" fill="#FFFFFF">Be at the museum security line by 09:35</text>
    <rect x="866" y="222" width="264" height="54" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.34"/>
    <text x="998" y="246" text-anchor="middle" font-size="13" font-weight="650" fill="#DDEAF2">TIMED ENTRY</text>
    <text x="998" y="267" text-anchor="middle" font-size="17" font-weight="760" fill="#FFFFFF">10:00 · 2 tickets</text>

    <line x1="167" y1="354" x2="167" y2="837" stroke="#D1D9DF" stroke-width="5"/>

    <!-- Timeline rows -->
    <g transform="translate(92 334)">
      <circle cx="75" cy="28" r="18" fill="#168270" stroke="#FFFFFF" stroke-width="4"/>
      <text x="0" y="34" class="time">08:30</text>
      <text x="112" y="26" class="item">Breakfast + ticket check</text>
      <text x="112" y="50" class="meta">45 min · save QR codes offline · check venue and transit alerts</text>
      <rect x="824" y="8" width="150" height="35" rx="17" fill="#E7F2EE"/>
      <text x="899" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#14705E">PRE-DEPARTURE</text>
    </g>
    <g transform="translate(92 416)">
      <circle cx="75" cy="28" r="18" fill="#315E85" stroke="#FFFFFF" stroke-width="4"/>
      <text x="0" y="34" class="time">09:05</text>
      <text x="112" y="26" class="item">Metro to the museum district</text>
      <text x="112" y="50" class="meta">20 min ride + 10 min walk · one transfer · use exit B</text>
      <path d="M824 25 H918" fill="none" stroke="#315E85" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 8"/>
      <text x="936" y="31" font-size="13" font-weight="700" fill="#315E85">TRANSIT</text>
    </g>
    <g transform="translate(92 498)">
      <rect x="-14" y="-6" width="1000" height="70" rx="18" fill="#F9F0D9" stroke="#E9C56F"/>
      <circle cx="75" cy="28" r="20" fill="#D38600" stroke="#FFFFFF" stroke-width="4"/>
      <text x="0" y="34" class="time">09:35</text>
      <text x="112" y="26" class="item">Arrive for security · protect this buffer</text>
      <text x="112" y="50" class="meta">Entry at 10:00 · do not move this anchor without approval</text>
      <rect x="820" y="10" width="140" height="36" rx="18" fill="#D38600"/>
      <text x="890" y="34" text-anchor="middle" font-size="13" font-weight="760" fill="#FFFFFF">HARD ANCHOR</text>
    </g>
    <g transform="translate(92 584)">
      <circle cx="75" cy="28" r="18" fill="#B93B48" stroke="#FFFFFF" stroke-width="4"/>
      <text x="0" y="34" class="time">10:00</text>
      <text x="112" y="26" class="item">Museum visit</text>
      <text x="112" y="50" class="meta">2 hr · focus list: main collection + temporary exhibition</text>
      <rect x="824" y="8" width="150" height="35" rx="17" fill="#F6E8E9"/>
      <text x="899" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#A83340">TICKET IN WALLET</text>
    </g>
    <g transform="translate(92 666)">
      <circle cx="75" cy="28" r="18" fill="#168270" stroke="#FFFFFF" stroke-width="4"/>
      <text x="0" y="34" class="time">12:20</text>
      <text x="112" y="26" class="item">Route-linked lunch</text>
      <text x="112" y="50" class="meta">75 min · primary is 4 min away · switch if the queue exceeds 15 min</text>
      <rect x="824" y="8" width="150" height="35" rx="17" fill="#E7F2EE"/>
      <text x="899" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#14705E">BACKUP READY</text>
    </g>
    <g transform="translate(92 748)">
      <circle cx="75" cy="28" r="18" fill="#7354A5" stroke="#FFFFFF" stroke-width="4"/>
      <text x="0" y="34" class="time">14:00</text>
      <text x="112" y="26" class="item">Design district walk</text>
      <text x="112" y="50" class="meta">90 min · today's first-cut item if late or tired</text>
      <rect x="824" y="8" width="150" height="35" rx="17" fill="#EFEAF6"/>
      <text x="899" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#674996">FIRST CUT</text>
    </g>
    <g transform="translate(92 830)">
      <circle cx="75" cy="28" r="18" fill="#008F8F" stroke="#FFFFFF" stroke-width="4"/>
      <text x="0" y="34" class="time">16:00</text>
      <text x="112" y="26" class="item">Garden recovery block</text>
      <text x="112" y="50" class="meta">45 min seated · water + weather check before the evening</text>
      <rect x="824" y="8" width="150" height="35" rx="17" fill="#E4F2F2"/>
      <text x="899" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#087777">RECOVERY</text>
    </g>

    <!-- Route strip -->
    <g transform="translate(88 922)">
      <rect width="1020" height="92" rx="20" fill="#F5F6F3"/>
      <rect x="18" y="16" width="134" height="60" rx="15" fill="#173A60"/>
      <text x="85" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#BFD5E6">ROUTE</text>
      <text x="85" y="61" text-anchor="middle" font-size="15" font-weight="760" fill="#FFFFFF">5.2 km</text>
      <path d="M196 48 C256 12 314 80 380 42 S510 20 580 52 S716 76 788 34 S892 22 970 50" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
      <path d="M196 48 C256 12 314 80 380 42 S510 20 580 52 S716 76 788 34 S892 22 970 50" fill="none" stroke="#B93B48" stroke-width="6" stroke-linecap="round"/>
      <circle cx="196" cy="48" r="13" fill="#B93B48" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="380" cy="42" r="13" fill="#D38600" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="580" cy="52" r="13" fill="#168270" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="788" cy="34" r="13" fill="#7354A5" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="970" cy="50" r="13" fill="#008F8F" stroke="#FFFFFF" stroke-width="3"/>
      <text x="196" y="77" text-anchor="middle" class="micro">HOTEL</text>
      <text x="380" y="77" text-anchor="middle" class="micro">MUSEUM</text>
      <text x="580" y="77" text-anchor="middle" class="micro">LUNCH</text>
      <text x="788" y="77" text-anchor="middle" class="micro">DESIGN</text>
      <text x="970" y="77" text-anchor="middle" class="micro">GARDEN</text>
    </g>

    <!-- Right action rail -->
    <g transform="translate(1202 194)">
      <rect width="540" height="855" rx="28" fill="#173A60" filter="url(#shadow)"/>
      <text x="30" y="44" class="label" fill="#AFC8DC">ACTION RAIL</text>
      <text x="30" y="80" font-size="24" font-weight="740" fill="#FFFFFF">Only what matters on the day</text>

      <g transform="translate(24 108)">
        <rect width="492" height="118" rx="20" fill="#FFFFFF"/>
        <text x="22" y="31" class="label" fill="#B03A46">TICKET WALLET</text>
        <text x="22" y="63" font-size="18" font-weight="720" class="navy">Museum · 10:00 · 2 adults</text>
        <circle cx="36" cy="91" r="10" fill="#168270"/>
        <text x="56" y="97" font-size="14" font-weight="600" fill="#536B80">QR saved offline · confirmation verified</text>
      </g>

      <g transform="translate(24 242)">
        <rect width="492" height="128" rx="20" fill="#F9F0D9"/>
        <text x="22" y="31" class="label" fill="#9A6200">IF LATE</text>
        <text x="22" y="64" font-size="18" font-weight="720" class="navy">Protect the 10:00 entry.</text>
        <text x="22" y="91" font-size="15" font-weight="540" fill="#5E7080">Skip the design walk first; never steal</text>
        <text x="22" y="112" font-size="15" font-weight="540" fill="#5E7080">time from security or the lunch buffer.</text>
      </g>

      <g transform="translate(24 386)">
        <rect width="492" height="128" rx="20" fill="#E7F1F4"/>
        <text x="22" y="31" class="label" fill="#22647A">IF RAIN / CLOSED</text>
        <text x="22" y="64" font-size="18" font-weight="720" class="navy">Use the indoor design center.</text>
        <text x="22" y="91" font-size="15" font-weight="540" fill="#5E7080">Same transit corridor · no new booking ·</text>
        <text x="22" y="112" font-size="15" font-weight="540" fill="#5E7080">arrive at the garden only if weather clears.</text>
      </g>

      <g transform="translate(24 530)">
        <rect width="492" height="128" rx="20" fill="#E7F2EE"/>
        <text x="22" y="31" class="label" fill="#14705E">PACE</text>
        <text x="22" y="67" font-size="18" font-weight="720" class="navy">3 hr standing · 5.2 km walking</text>
        <rect x="22" y="88" width="448" height="10" rx="5" fill="#CBDDD7"/>
        <rect x="22" y="88" width="278" height="10" rx="5" fill="#168270"/>
        <text x="22" y="119" font-size="13" font-weight="620" fill="#536B80">Recovery at 16:00 · water before leaving lunch</text>
      </g>

      <g transform="translate(24 674)">
        <rect width="492" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.22"/>
        <text x="22" y="29" class="label" fill="#BFD5E6">ONE-TAP LINKS</text>
        <text x="22" y="55" font-size="15" font-weight="640" fill="#FFFFFF">Museum entrance · lunch · backup · garden</text>
      </g>

      <g transform="translate(24 770)">
        <rect width="492" height="54" rx="18" fill="#168270"/>
        <text x="246" y="34" text-anchor="middle" font-size="15" font-weight="760" fill="#FFFFFF">PROTECT 09:35 · EVERYTHING ELSE CAN FLEX</text>
      </g>
    </g>
  </g>
</svg>
