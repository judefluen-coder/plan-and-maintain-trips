name: Bug report
description: Report a reproducible problem with planning instructions, validation, or exports.
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed traveler identity, booking references, QR codes, payment details, and tokens.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Skill instructions
        - Trip validation
        - Route or day-card export
        - Offline page, KML, or ICS
        - Example or documentation
        - Optional publisher
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command or a minimal redacted trip state. For live travel facts, link the official source and state the travel date.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Codex version if relevant, and repository version or commit.
