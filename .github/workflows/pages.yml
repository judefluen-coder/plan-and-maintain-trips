name: Publish example

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare the fictional offline example
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp examples/lisbon-coast/route-offline.html "$RUNNER_TEMP/site/index.html"
          cp examples/lisbon-coast/route.svg "$RUNNER_TEMP/site/route.svg"
          cp examples/lisbon-coast/trip.kml "$RUNNER_TEMP/site/trip.kml"
          cp examples/lisbon-coast/trip.ics "$RUNNER_TEMP/site/trip.ics"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
